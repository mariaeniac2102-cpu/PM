 <h2>Chapéu marrom com estilo clássico e toque country. Confortável, versátil e perfeito para um visual elegante e autêntico. 🤠🤎</h2></font>

<td><img src="produtos/chapeu.marrom.jpg">

 <button onclick="adicionarAoCarrinho('Chapéu Marrom', 200.00, 'produtos/chapeu.marrom.jpg')" class="btn-compra">
        🛒 ADICIONAR AO CARRINHO
    </button>
</center>


<script>
    function adicionarAoCarrinho(nome, preco, imagem) {
        let carrinho = JSON.parse(localStorage.getItem('meuCarrinho')) || [];
       
        carrinho.push({
            nome: nome,
            preco: preco,
            imagem: imagem
        });
       
        localStorage.setItem('meuCarrinho', JSON.stringify(carrinho));
       
        window.location.href = 'carrinho.html';
    }
</script>
