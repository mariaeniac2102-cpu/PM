padding:20px;
}


header img{
max-width:600px;
}




.produtos{
display:grid;
grid-template-columns:repeat(4, 1fr);
gap:20px;
padding:20px;
}




.produto-link{

}




.card{
background:white;
padding:15px;
border-radius:10px;
text-align:center;
box-shadow:0 0 10px rgba(0,0,0,0.1);
transition:0.2s;
}




.card:hover{
transform:scale(1.05);
}


.card img{
width:200px;
height:200px;
object-fit:cover;
}


.preco{
color:red;
font-size:18px;
font-weight:bold;
}
